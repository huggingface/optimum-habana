name: "\U0001F680 Feature request"
description: Submit a proposal/request for a new Optimum Habana feature
labels: [ "feature" ]
body:
  - type: markdown
    attributes:
      value: |
        > **End of support:** As of 2026-10-31, `optimum-habana` is no longer officially supported.
        > No new features are planned, and feature requests may not be reviewed.

  - type: textarea
    id: feature-request
    validations:
      required: true
    attributes:
      label: Feature request
      description: |
        A clear and concise description of the feature proposal. Please provide a link to the paper and code in case they exist.

  - type: textarea
    id: motivation
    validations:
      required: true
    attributes:
      label: Motivation
      description: |
        Please outline the motivation for the proposal. Is your feature request related to a problem? e.g., I'm always frustrated when [...]. If this is related to another GitHub issue, please link here too.


  - type: textarea
    id: contribution
    validations:
      required: true
    attributes:
      label: Your contribution
      description: |
        Is there any way that you could help, e.g. by submitting a PR?
