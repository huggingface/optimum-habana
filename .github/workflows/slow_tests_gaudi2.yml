name: (Gaudi2) Non-regression tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'  # every Wednesday and Saturday at 1am CET (midnight winter time)

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  example-diff:
    permissions:
      contents: read
    name: Test examples differences
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash tests/ci/example_diff_tests.sh
  stable-diffusion:
    permissions:
      contents: read
    name: Test Stable Diffusion
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - example-diff  # run the job when the previous test job is done
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        env:
          TEXT_GENERATION_CI_HUB_TOKEN: ${{ secrets.TEXT_GENERATION_CI_HUB_TOKEN }}
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash tests/ci/slow_tests_diffusers.sh "$TEXT_GENERATION_CI_HUB_TOKEN"
  deepspeed:
    permissions:
      contents: read
    name: Test DeepSpeed models
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - stable-diffusion  # run the job when the previous test job is done
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        env:
          TEXT_GENERATION_CI_HUB_TOKEN: ${{ secrets.TEXT_GENERATION_CI_HUB_TOKEN }}
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash tests/ci/slow_tests_deepspeed.sh "$TEXT_GENERATION_CI_HUB_TOKEN"
  fsdp:
    permissions:
      contents: read
    name: Test FSDP models
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - deepspeed  # run the job when the previous test job is done
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        env:
          TEXT_GENERATION_CI_HUB_TOKEN: ${{ secrets.TEXT_GENERATION_CI_HUB_TOKEN }}
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            make slow_tests_fsdp TOKEN="$TEXT_GENERATION_CI_HUB_TOKEN"
  multi-card:
    permissions:
      contents: read
    name: Test multi-card models
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - fsdp  # run the job when the previous test job is done
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        env:
          TEXT_GENERATION_CI_HUB_TOKEN: ${{ secrets.TEXT_GENERATION_CI_HUB_TOKEN }}
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash tests/ci/slow_tests_8x.sh "$TEXT_GENERATION_CI_HUB_TOKEN"
  single-card:
    permissions:
      contents: read
    name: Test single-card models
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - deepspeed
      - multi-card  # run the job when the previous test jobs are done
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e RUN_ALBERT_XXL_1X=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash tests/ci/slow_tests_1x.sh
  text-generation:
    permissions:
      contents: read
    name: Test text-generation example
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - deepspeed
      - multi-card
      - single-card  # run the job when the previous test jobs are done
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        env:
          TEXT_GENERATION_CI_HUB_TOKEN: ${{ secrets.TEXT_GENERATION_CI_HUB_TOKEN }}
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            make slow_tests_text_generation_example TOKEN="$TEXT_GENERATION_CI_HUB_TOKEN"
  trl:
    permissions:
      contents: read
    name: Test TRL integration
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - text-generation
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash tests/ci/slow_tests_trl.sh
  sentence-transformers:
    permissions:
      contents: read
    name: Test Sentence Transformers integration
    if: ${{ !cancelled() && (success() || failure()) }}
    needs:
      - trl
    runs-on: [self-hosted, linux, x64, gaudi2, nightly]
    steps:
      - name: Checkout Optimum Habana
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'huggingface/optimum-habana'
          path: optimum-habana
      - name: Checkout Sentence Transformers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'UKPLab/sentence-transformers'
          path: sentence-transformers
      - name: Pull image
        run: |
            docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest
      - name: Run tests
        run: |
            docker run \
            --rm \
            -v $PWD:/root/workspace \
            -v /scratch-1:/data \
            --workdir=/root/workspace \
            --runtime=habana \
            -e HABANA_VISIBLE_DEVICES=all \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e GAUDI2_CI=1 \
            -e HF_HOME=/data \
            --cap-add=sys_nice \
            --net=host \
            --ipc=host \
            vault.habana.ai/gaudi-docker/1.24.0/ubuntu22.04/habanalabs/pytorch-installer-2.10.0:latest \
            /bin/bash optimum-habana/tests/ci/sentence_transformers.sh
